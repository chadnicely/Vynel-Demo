# The Vynel desktop shell — today a single always-on-top Jarvis overlay window
# rendering local-web's /jarvis route (WebView2 has full Web Speech; probed live
# 2026-07-07, see docs/module-notes/voice-engine.md).
[package]
name = "vynel-desktop"
version = "0.0.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `unstable` unlocks multiwebview (Window::add_child) — the embedded browser
# is a native child webview, because an <iframe> obeys X-Frame-Options and
# most real sites refuse to embed.
tauri = { version = "2", features = ["unstable"] }
# B2 lifecycle hardening: one process owns the daemon (second launch routes
# here), shell diagnostics reach a file instead of a swallowed stderr, and the
# kill-on-close Job Object reaps the daemon tree on ANY shell death.
tauri-plugin-single-instance = "2"
tauri-plugin-log = "2"
log = "0.4"
# B3 auto-update: signed artifacts from the public vynel-releases repo, a
# native yes/no prompt before installing.
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2"
# generate_context! references ::serde_json when the config carries a
# plugins section (the release overlay's updater block); engine.json (where
# the engine runs) is read pre-daemon and written by the settings commands.
serde_json = "1"
serde = { version = "1", features = ["derive"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
] }
