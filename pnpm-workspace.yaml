# Vynel workspace map. Packages fill in as we move code (see docs/architecture.md §10).
packages:
  - "apps/*"
  - "packages/*"

# Build-script approval (pnpm 11). Every dep that ships a build script must be listed here
# (true = run its build, false = skip) or pnpm fails with ERR_PNPM_IGNORED_BUILDS.
allowBuilds:
  better-sqlite3: true # SQLite bindings — @vynel/db
  esbuild: true # bundler used by vitest
  protobufjs: true # transitive via @huggingface/transformers; build is a benign no-op
