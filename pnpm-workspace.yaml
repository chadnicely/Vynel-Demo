# Vynel workspace map. Packages fill in as we move code (see docs/architecture.md §10).
packages:
  - "apps/*"
  - "packages/*"
  - "scripts"

# Build-script approval. NOTE (pnpm 11.0.0 quirk): this pnpm only honors `true` here —
# `false` and `ignoredBuiltDependencies` do NOT silence ERR_PNPM_IGNORED_BUILDS (fixed in a
# newer pnpm; bumping the pinned version is a follow-up). So every build-script dep is `true`.
# The native prebuilts (onnxruntime/sharp) are one-time, cached, and harmless.
allowBuilds:
  better-sqlite3: true # SQLite bindings — @vynel/db
  cpu-features: true # optional ssh2 speedup — native prebuilt, harmless
  esbuild: true # bundler used by vitest
  onnxruntime-node: true # native ONNX runtime (real embeddings backend) — prebuilt binaries
  protobufjs: true # transitive via @huggingface/transformers
  sharp: true # image processing — prebuilt
  ssh2: true # ssh client bindings — @vynel/ssh-servers
  unrs-resolver: true # eslint resolver speedup — prebuilt
  vue-demi: true # vue2/3 compat shim — postinstall picks the vue-3 build (@tanstack/vue-query)
